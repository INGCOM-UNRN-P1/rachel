[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rachel"
version = "0.1.0"
description = "Desensamblador y visualizador pedagógico de estructuras de control y jump tables en C"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
rachel = "rachel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rachel"]

[tool.pytest.ini_options]
pythonpath = ["src"]
